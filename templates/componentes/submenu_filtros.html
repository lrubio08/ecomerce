{% load static %}
<link rel="stylesheet" href="{% static 'css/productos.css' %}">

<div class="container">
    <div class="row">
        <div class="col-4">
            <div class="offcanvas offcanvas-start custom-sidebar" tabindex="-1" id="filtrosOffcanvas" aria-labelledby="filtrosOffcanvasLabel">
                <div class="offcanvas-header">
                    <h5 id="filtrosOffcanvasLabel">Filtros</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
                </div>
                <div class="offcanvas-body">
                    <div class="filtro-bloque">
                        {% for filtro in filtros %}
                        <form method="get">
                            {% for nombre, f in filtros_dinamicos.items %} {% if f.tipo == 'lista' %}
                            <h5>{{ nombre }}</h5>
                            {% for valor in f.valores %}
                            <label class="d-block">
                                    <input type="checkbox" name="filtro_{{ nombre }}" value="{{ valor }}">
                                    {{ valor }}{% if f.unidad %} {{ f.unidad }}{% endif %}
                                    </label> {% endfor %} {% endif %} {% endfor %}
                            <button type="submit" class="btn btn-outline-light w-100 mt-3">Aplicar filtros</button>
                            <a href="{% url 'productos_por_categoria' slug=categoria.slug %}" class="btn btn-outline-light w-100 mt-2">Limpiar filtros</a>
                        </form>

                        {% endfor %}

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
